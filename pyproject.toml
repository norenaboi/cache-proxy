[project]
name = "openrouter-cache-proxy"
version = "0.1.0"
description = "OpenAI-compatible proxy that adds OpenRouter prompt-cache breakpoints"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115,<1",
  "httpx>=0.27,<1",
  "uvicorn>=0.30,<1",
]

[project.optional-dependencies]
test = [
  "asgi-lifespan>=2.1,<3",
  "pytest>=8,<9",
  "pytest-asyncio>=0.24,<1",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
